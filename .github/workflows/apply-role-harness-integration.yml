          feature = Path('tools/feature_workflow.py')
          text = feature.read_text(encoding='utf-8')
          start = text.index('def parse_review_if_present(')
          end = text.index('\ndef write_required_reviews(', start)
          replacement = '''def parse_review_if_present(root: Path, feature_id: str, review: dict[str, Any], design: dict[str, Any] | None = None) -> dict[str, Any]:
              path = feature_design_lib.safe_repo_path(root, str(review.get("report_path", "")))
              if path is None:
                  return {**review, "status": "blocked", "blocker": "unsafe report path"}
              if not path.exists():
                  return {**review, "status": "pending"}

              if review.get("runner_required"):
                  sidecar = role_run_lib.role_result_sidecar_path(path)
                  payload, problems = role_run_lib.validate_role_result(
                      root,
                      sidecar,
                      expected_role=str(review.get("role", "")),
                      expected_task_id=str(review.get("task_id", "")),
                      expected_feature_id=feature_id,
                      expected_slice_id=str(review.get("slice_id") or ""),
                  )
                  if payload is None or problems:
                      blocker = "; ".join(problems or ["validated Codex role-run sidecar is missing"])
                      return {**review, "status": "blocked", "blocker": blocker}
                  verdict = str(payload.get("verdict", ""))
                  status = "blocked" if verdict == "STOP_SHIP" else "acceptable"
                  parsed_review = {
                      **review,
                      "status": status,
                      "verdict": verdict,
                      "report_sha256": feature_design_lib.sha256_file(path),
                      "role_run_result_path": feature_design_lib.repo_rel(root, sidecar),
                      "role_run_result_sha256": feature_design_lib.sha256_file(sidecar),
                      "execution_surface": "codex_role_runner",
                  }
                  if design is not None and review.get("phase") == "design":
                      record_path = approve_feature_design.design_review_record_path(
                          root,
                          feature_id,
                          str(review["role"]),
                      )
                      if not record_path.exists():
                          return {
                              **parsed_review,
                              "status": "blocked",
                              "blocker": "hash-bound design review record is missing",
                          }
                      record = read_json(record_path)
                      parsed_review["review_record_path"] = feature_design_lib.repo_rel(root, record_path)
                      parsed_review["review_record_sha256"] = feature_design_lib.sha256_file(record_path)
                      parsed_review["reviewed_markdown_sha256"] = record.get("reviewed_markdown_sha256")
                      parsed_review["reviewed_registry_payload_sha256"] = record.get("reviewed_registry_payload_sha256")
                  return parsed_review

              try:
                  parsed = render_codex_exec_prompt.parse_required_marker(
                      str(review["role"]),
                      path.read_text(encoding="utf-8", errors="replace"),
                  )
              except ValueError as exc:
                  return {**review, "status": "blocked", "blocker": str(exc)}
              verdict = parsed["verdict"]
              status = "blocked" if verdict == "STOP_SHIP" else "acceptable"
              parsed_review = {
                  **review,
                  "status": status,
                  "verdict": verdict,
                  "report_sha256": feature_design_lib.sha256_file(path),
              }
              if design is not None and review.get("phase") == "design":
                  try:
                      record = approve_feature_design.write_design_review_record(
                          root=root,
                          feature_id=feature_id,
                          role=str(review["role"]),
                          report_path=feature_design_lib.repo_rel(root, path),
                          reviewed_design=design,
                          reviewer_binding=f"codex_exec:{review['role']}",
                          read_only=True,
                      )
                      record_path = approve_feature_design.design_review_record_path(root, feature_id, str(review["role"]))
                      parsed_review["review_record_path"] = feature_design_lib.repo_rel(root, record_path)
                      parsed_review["review_record_sha256"] = feature_design_lib.sha256_file(record_path)
                      parsed_review["reviewed_markdown_sha256"] = record["reviewed_markdown_sha256"]
                      parsed_review["reviewed_registry_payload_sha256"] = record["reviewed_registry_payload_sha256"]
                  except Exception as exc:
                      return {**parsed_review, "status": "blocked", "blocker": str(exc)}
              return parsed_review
          '''
          feature.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          replace_once(
              'tools/feature_workflow.py',
              '''    for review in report["reviews"]:
                  prompt_path = root / review["prompt_path"]
