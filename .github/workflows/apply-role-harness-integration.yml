              '''    events, trace_problems = role_run_lib.parse_jsonl_objects(trace_path)
                  failure_reasons = list(trace_problems)
                  verdict = ""
          ''',
              '''    events, trace_problems = role_run_lib.parse_jsonl_objects(trace_path)
                  failure_reasons = list(trace_problems)
                  terminal_observed = any(
                      str(event.get("type", "")) in {"turn.completed", "turn.failed", "turn.cancelled"}
                      for event in events
                  )
                  if events and not terminal_observed:
                      failure_reasons.append("Codex trace is missing a terminal turn event")
                  verdict = ""
          ''',
          )
          replace_once(
