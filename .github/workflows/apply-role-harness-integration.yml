import argparse
import json
from pathlib import Path

from tools import feature_workflow


def design() -> dict[str, object]:
    return {
        "schema_version": "playbook.feature_design.v1",
        "feature_id": "F01",
        "status": "review_required",
        "planning_depth": "designed_slices",
        "risk_level": "high",
        "brief_ref": "docs/PROJECT_BRIEF.md",
        "architecture_refs": [],
        "approval_policy": "human_required",
        "slices": [],
    }


def test_feature_workflow_emits_guarded_runner_command(tmp_path: Path, monkeypatch) -> None:
    captured: dict[str, object] = {}
    monkeypatch.setattr(feature_workflow, "validate_task_feature_slice_binding", lambda *args, **kwargs: (None, {}, {}))
    monkeypatch.setattr(feature_workflow, "load_design", lambda *args, **kwargs: (tmp_path / "design.json", design(), []))
    monkeypatch.setattr(feature_workflow, "render_prompt", lambda *args, **kwargs: "bounded prompt\n")

    def capture(_root: Path, _feature_id: str, payload: dict[str, object]) -> dict[str, object]:
        captured.update(payload)
        return payload

    monkeypatch.setattr(feature_workflow, "write_required_reviews", capture)
    args = argparse.Namespace(
        root=tmp_path,
        task="T14",
        feature_id="F01",
        slice_id="",
        role="auto",
    )

    assert feature_workflow.cmd_review(args) == 0
    reviews = captured["reviews"]
    assert isinstance(reviews, list)
    assert {review["role"] for review in reviews} == {
        "product_design_review",
        "program_design_review",
    }
    assert all(review["runner_required"] is True for review in reviews)
    assert all("tools/run_codex_role.py" in review["suggested_command"] for review in reviews)
    assert all(review["task_id"] == "T14" for review in reviews)


def test_guarded_report_without_role_sidecar_is_blocked(tmp_path: Path) -> None:
    report = tmp_path / ".playbook-artifacts/reports/F01/program_design_review.md"
    report.parent.mkdir(parents=True)
    report.write_text("PROGRAM_DESIGN_REVIEW: PASS\n", encoding="utf-8")
    review = {
        "role": "program_design_review",
        "phase": "design",
        "task_id": "T14",
        "report_path": ".playbook-artifacts/reports/F01/program_design_review.md",
        "runner_required": True,
    }

    parsed = feature_workflow.parse_review_if_present(tmp_path, "F01", review, design())

    assert parsed["status"] == "blocked"
    assert "sidecar" in parsed["blocker"]
''', encoding='utf-8')

