name: Apply Role Harness Integration

on:
  push:
    branches:
      - agent/codex-role-execution-harness
    paths:
      - '.github/workflows/apply-role-harness-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply deterministic integration patches
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          # Preserve only the credentials needed by Codex itself. The shell tool receives
          # a separate include-only policy and never sees provider keys.
          replace_once(
              'tools/role_run_lib.py',
              '''SUPPORTED_ROLES = {
              "product_design_review": {"phase": "design", "sandbox": "read-only"},
              "program_design_review": {"phase": "design", "sandbox": "read-only"},
              "slice_review": {"phase": "slice", "sandbox": "read-only"},
              "maintainability_review": {"phase": "slice", "sandbox": "read-only"},
          }
          SAFE_ID_RE = re.compile(r"[^A-Za-z0-9._-]+")
          ''',
              '''SUPPORTED_ROLES = {
              "product_design_review": {"phase": "design", "sandbox": "read-only"},
              "program_design_review": {"phase": "design", "sandbox": "read-only"},
              "slice_review": {"phase": "slice", "sandbox": "read-only"},
              "maintainability_review": {"phase": "slice", "sandbox": "read-only"},
          }
          SAFE_ENVIRONMENT_KEYS = {
              "CODEX_API_KEY",
              "CODEX_HOME",
              "HOME",
              "LANG",
              "LC_ALL",
              "OPENAI_API_KEY",
              "PATH",
              "SSL_CERT_DIR",
              "SSL_CERT_FILE",
          }
          SAFE_ID_RE = re.compile(r"[^A-Za-z0-9._-]+")
          ''',
          )
          replace_once(
              'tools/role_run_lib.py',
              '''def safe_id(value: str) -> str:
              normalized = SAFE_ID_RE.sub("-", value.strip()).strip("-._")
              return normalized or "run"
          ''',
              '''def safe_id(value: str) -> str:
              normalized = SAFE_ID_RE.sub("-", value.strip()).strip("-._")
              return normalized or "run"


          def safe_environment(source: dict[str, str]) -> dict[str, str]:
              """Keep Codex auth/runtime inputs while excluding unrelated host secrets."""
              return {
                  key: value
                  for key, value in source.items()
                  if key in SAFE_ENVIRONMENT_KEYS or key.startswith("PLAYBOOK_ROLE_RUN_TEST_")
              }
          ''',
          )

          replace_once(
              'tools/run_codex_role.py',
              '''            "-c",
                          "include_collaboration_mode_instructions=false",
                          "-",
                      )
                  )
          ''',
              '''            "-c",
                          "include_collaboration_mode_instructions=false",
                          "-c",
                          (
                              'shell_environment_policy.include_only=["PATH","HOME","LANG","LC_ALL",'
                              '"SSL_CERT_DIR","SSL_CERT_FILE"]'
                          ),
                          "-",
                      )
                  )
          ''',
          )
          replace_once(
              'tools/run_codex_role.py',
              '''            stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          timeout=args.timeout,
                          check=False,
                      )
          ''',
