name: Playbook Checks

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  checks:
    # The frozen pilot sandbox supports the distribution Python runtime in /usr
    # and /lib; setup-python's toolcache shared library is outside those mounts.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Frozen historical source integrity is verified at exact retained commits.
          fetch-depth: 0

      - name: Install sandbox and Python virtual environment support
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor bubblewrap python3.12-venv
          # Allow only the system bwrap executable to create user namespaces on
          # this disposable runner; keep the global AppArmor restriction enabled.
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' \
            | sudo tee /etc/apparmor.d/bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

      - name: Install test dependencies
        run: |
          /usr/bin/python3.12 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Verify installed test environment
        run: |
          python -m pip check
          python -c "import ai_workflow_harness_lab; import pytest; import jsonschema"

      - name: Run tests
        run: python -m pytest -q -ra

      - name: Canonical playbook verification
        run: python tools/verify_playbook.py --root .

      - name: Compile Python helpers
        run: |
          python -m py_compile tools/*.py
          python -m py_compile templates/cost_adapters/python/telemetry_adapter.py

      - name: Validate JSON artifacts
        run: |
          python -m json.tool schemas/cost_telemetry_entry.schema.json >/dev/null
          python -m json.tool templates/COST_TELEMETRY_ENTRY.json >/dev/null

      - name: Smoke-test project initializer
        run: |
          python tools/init_playbook_project.py "$RUNNER_TEMP/playbook-smoke" \
            --mode strict \
            --project-name "Playbook Smoke" \
            --operational-pain "CI needs reproducible strict project bootstrap." \
            --current-workaround "Manual inspection of generated files." \
            --first-proof-metric "Generated strict project passes smoke checks." \
            --verify-argv '["{python}", "-c", "raise SystemExit(0)"]' \
            --with-cost-architecture \
            --with-router-eval \
            --with-rag-eval \
            --with-cost-adapter \
            --external-skill smoke-skill

      - name: External skill security gate
        run: python tools/skill_security_gate.py --root . --discover-agent-skills

      - name: Cost rollup smoke test
        run: |
          python tools/cost_rollup.py \
            --input "$RUNNER_TEMP/missing-cost.jsonl" \
            --output "$RUNNER_TEMP/ai_cost_rollup.md"

      - name: Integrity check
        run: python tools/integrity_check.py --root .
