name: Native Product Checks

on:
  push:
    branches: ["master", "main", "docs/codex-frontend-skills-mcp-20260919", "feature/playbook-vnext-20260919"]
  pull_request:
    branches: ["master", "main", "docs/codex-frontend-skills-mcp-20260919"]

permissions:
  contents: read

jobs:
  native:
    name: Native package and Harness Lab integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install existing lab dependencies
        run: python -m pip install -e companion/ai_workflow_harness_lab
      - name: Check native lab adapter (fake CLI, no inference)
        run: |
          python -m unittest discover -s evals/native -p 'test_*.py' -v
          python -m ai_workflow_harness_lab.cli validate-suite evals/native/harness

  package:
    name: Package and Role Runner / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Check canonical runtime and portable delivery (fake CLI, no inference)
        run: |
          python distribution/native/sync_runtime.py --check
          python -m unittest discover -s distribution/native -p "test_*.py" -v
      - name: Check lifecycle and transfer helper on this OS
        run: python -m unittest discover -s tests/vnext -p "test_*.py" -v
      - name: Build offline preview
        run: python distribution/native/build.py --output .playbook-artifacts/ci-kit
      - name: Extract actual archive
        run: python -c "from pathlib import Path; import zipfile; zipfile.ZipFile(next(Path('.playbook-artifacts/ci-kit').glob('*.zip'))).extractall('.playbook-artifacts/extracted')"
      - name: Install pinned browser probe dependency
        run: npm install --prefix .playbook-artifacts/browser-tools --ignore-scripts playwright@1.61.1
      - name: Install Chromium for the probe
        run: node .playbook-artifacts/browser-tools/node_modules/playwright/cli.js install chromium
      - name: Check extracted starter in a real browser
        env:
          PLAYBOOK_EVAL_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.playbook-artifacts/browser-tools/node_modules/playwright
        run: node evals/native/check-launcher.cjs .playbook-artifacts/browser-results .playbook-artifacts/extracted/Playbook/START.html
      - name: Preserve exact tracked source for reproducible inspection
        if: matrix.os == 'ubuntu-latest'
        run: git archive --format=zip --output=.playbook-artifacts/ci-kit/Playbook-source.zip HEAD
      - name: Retain the checked kit and browser evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vnext-kit-${{ matrix.os }}
          path: |
            .playbook-artifacts/ci-kit/
            .playbook-artifacts/browser-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
