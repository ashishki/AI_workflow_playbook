name: Engineering secret-access experiment

on:
  push:
    branches: ['feature/engineering-secret-access-*']
    paths: ['engineering/SECRETS_RU.md', 'engineering/experiments/secret-access/**', '.github/workflows/secret-access-checks.yml']
  pull_request:
    paths: ['engineering/SECRETS_RU.md', 'engineering/experiments/secret-access/**', '.github/workflows/secret-access-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Synthetic mechanism / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Test synthetic fixture and reporting without accounts or models
        run: python -m unittest discover -s engineering/experiments/secret-access -p "test_*.py" -v
      - name: Check whitespace
        run: git diff --check
