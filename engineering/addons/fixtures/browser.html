<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playbook: browser acceptance fixture</title>
<style>body{font:18px system-ui;max-width:640px;margin:2rem auto;padding:0 1rem}label{display:block;margin:1rem 0}input,button{font:inherit;max-width:100%}li{overflow-wrap:anywhere}</style>
<h1>Проверка интерфейса</h1>
<p>PB-ENGINEERING-ADDONS-1 · Только искусственные данные.</p>
<form id="form">
<label>Название заявки <input id="name" aria-label="Название заявки"></label>
<label><input id="fail" type="checkbox"> Имитировать сбой сохранения</label>
<button>Добавить</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<ul id="items" aria-label="Сохранённые заявки"></ul>
<button id="reset" type="button">Очистить тестовые записи</button>
<script>
const key='playbook-addon-fixture-v1';
const form=document.getElementById('form'),nameInput=document.getElementById('name');
const statusNode=document.getElementById('status'),items=document.getElementById('items');
let records=[];
try {records=JSON.parse(localStorage.getItem(key)||'[]'); if(!Array.isArray(records)||records.some(x=>typeof x!=='string'))throw Error();}
catch {statusNode.textContent='Ошибка чтения тестовых записей';records=[];}
function render(){items.replaceChildren(...records.map(text=>{const li=document.createElement('li');li.textContent=text;return li;}));}
form.addEventListener('submit',event=>{
  event.preventDefault(); const value=nameInput.value.trim();
  if(!value){statusNode.textContent='Введите название';return;}
  if(document.getElementById('fail').checked){statusNode.textContent='Ошибка сохранения: запись не добавлена';return;}
  if(records.includes(value)){statusNode.textContent='Такая запись уже есть';return;}
  const next=[...records,value];
  try{localStorage.setItem(key,JSON.stringify(next));records=next;render();statusNode.textContent='Сохранено';}
  catch{statusNode.textContent='Ошибка сохранения: запись не добавлена';}
});
document.getElementById('reset').addEventListener('click',()=>{localStorage.removeItem(key);records=[];render();statusNode.textContent='Тестовые записи очищены';});
render();
</script>
</html>
