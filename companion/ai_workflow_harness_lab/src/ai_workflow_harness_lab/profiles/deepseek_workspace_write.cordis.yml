# Pinned screening composition for DeepSeek Harness dsh-v0.1.0-rc.7.
# It is intentionally headless, telemetry-free, skill-free, and confined to
# workspace-write file effects. Network isolation remains the responsibility of
# the outer container/host because DSH SandboxMode governs filesystem effects.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 900000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: !!js Number(process.env.DSH_BASH_TIMEOUT_MS ?? 300000)

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a software engineering agent. Work only inside the supplied workspace, make the smallest change that satisfies the task, run the declared verification, and never claim success without observed evidence.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: true
    toolJobs: false
    goals: false

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- id: session-checkpoint-policy
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
